<!-- =========================================================
     TERRAFIT — AVATAR COMPONENT
     File: avatar/avatar.html
     ========================================================= -->

<div class="tf-avatar-user">

    <!-- AVATAR FRAME -->
    <div class="tf-avatar-frame">

        <div
            class="tf-avatar tf-avatar-md online"
            id="terraFitAvatar"
            role="img"
            aria-label="Player avatar"
        >

            <span
                class="tf-avatar-letter"
                id="terraFitAvatarLetter"
            >
                T
            </span>

            <span
                class="tf-avatar-status"
                id="terraFitAvatarStatus"
                aria-hidden="true"
            ></span>

        </div>

    </div>


    <!-- PLAYER INFORMATION -->
    <div class="tf-avatar-label">

        <span
            class="tf-avatar-label-name"
            id="terraFitAvatarName"
        >
            TERRAFIT PLAYER
        </span>

        <span
            class="tf-avatar-label-status"
            id="terraFitAvatarStatusText"
        >
            ONLINE
        </span>

    </div>

</div>
