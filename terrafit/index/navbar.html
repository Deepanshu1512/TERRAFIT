<!-- =====================================================
     NAVBAR
====================================================== -->

<nav
    class="navbar"
    id="mainNavbar"
>

    <!-- LOGO -->

    <div
        class="logo"
        id="brandLogo"
    >

        <div class="logo-mark">
            T
        </div>

        <div class="logo-text-group">

            <span class="logo-text">
                TERRAFIT
            </span>

            <span class="logo-sub">
                GPS MESH
            </span>

        </div>

    </div>


    <!-- DESKTOP NAV -->

    <div class="nav-links">

        <a
            href="#dashboard"
            class="nav-link active"
            id="navDashboard"
        >
            Dashboard
        </a>


        <a
            href="#activity-section"
            class="nav-link"
            id="navActivity"
        >
            Activity
        </a>


        <a
            href="#territory-section"
            class="nav-link"
            id="navTerritory"
        >
            Territory
        </a>


        <a
            href="#leaderboard-section"
            class="nav-link"
            id="navLeaderboard"
        >
            Leaderboard
        </a>


        <a
            href="#profile-section"
            class="nav-link"
            id="navProfile"
        >
            Profile
        </a>

    </div>


    <!-- NAV ACTIONS -->

    <div class="nav-actions">

        <div
            class="header-gps-badge"
            id="headerGpsBadge"
        >

            <span class="header-gps-dot"></span>

            <span id="headerGpsText">
                LOCATION REQUIRED
            </span>

        </div>


        <button
            class="login-btn"
            id="loginBtn"
            type="button"
        >
            LOG IN
        </button>


        <button
            class="login-btn"
            id="logoutBtn"
            type="button"
            style="display:none;"
        >
            LOG OUT
        </button>


        <button
            class="mobile-toggle"
            id="mobileMenuToggle"
            type="button"
            aria-label="Toggle Navigation"
        >
            ☰
        </button>

    </div>

</nav>
