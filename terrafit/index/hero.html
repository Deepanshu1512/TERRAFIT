<section id="landingPage" class="landing-page">

    <!-- HERO -->
    <div class="hero-section">

        <div class="hero-content">

            <div class="hero-label">
                <span class="hero-label-dot"></span>
                TERRITORY FITNESS PROTOCOL
            </div>

            <h1 class="hero-title">
                MOVE.<br>
                <span>CLAIM.</span><br>
                COMPETE.
            </h1>

            <p class="hero-description">
                Turn your real-world movement into territory.
                Run, walk or cycle. Capture zones. Earn XP.
                Compete with everyone around you.
            </p>

            <div class="hero-actions">

                <!-- IMPORTANT: script.js expects startBtn -->
                <button id="startBtn" class="primary-btn">
                    START CONQUEST
                    <span>→</span>
                </button>

                <!-- IMPORTANT: script.js expects demoBtn -->
                <button id="demoBtn" class="secondary-btn">
                    HOW IT WORKS
                </button>

            </div>

            <div class="hero-meta">

                <div class="hero-meta-item">
                    <span class="hero-meta-value">01</span>
                    <span class="hero-meta-label">TRACK</span>
                </div>

                <div class="hero-meta-line"></div>

                <div class="hero-meta-item">
                    <span class="hero-meta-value">02</span>
                    <span class="hero-meta-label">CAPTURE</span>
                </div>

                <div class="hero-meta-line"></div>

                <div class="hero-meta-item">
                    <span class="hero-meta-value">03</span>
                    <span class="hero-meta-label">DOMINATE</span>
                </div>

            </div>

        </div>


        <!-- HERO VISUAL -->
        <div class="hero-visual">

            <div class="hero-grid"></div>

            <div class="hero-radar">

                <div class="radar-ring radar-ring-1"></div>
                <div class="radar-ring radar-ring-2"></div>
                <div class="radar-ring radar-ring-3"></div>

                <div class="radar-cross horizontal"></div>
                <div class="radar-cross vertical"></div>

                <div class="radar-point point-1"></div>
                <div class="radar-point point-2"></div>
                <div class="radar-point point-3"></div>

                <div class="radar-center">
                    <span></span>
                </div>

            </div>

            <div class="hero-coordinate coordinate-1">
                22.3072° N<br>
                73.1812° E
            </div>

            <div class="hero-coordinate coordinate-2">
                GPS // ACTIVE
            </div>

            <div class="hero-visual-status">
                <span class="gps-dot"></span>
                TERRITORY SCAN ACTIVE
            </div>

        </div>

    </div>

</section>
